<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ProPath</title>
  <link rel="shortcut icon" href="../../../assets/Image/propath_small_icon.png" type="image/png" />
  <link href="../../assets/bootstrap-5.1.3-dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
  <link href="auth.css" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="row g-0">
      <div class="col-lg-5 d-none d-lg-flex">
        <div class="auth-sidebar w-100">
          <a href="../index.html" class="brand">
            <img src="../../assets/Image/propath_small_icon.png" alt="Logo" style="width: 32px; height: 32px; object-fit: contain;" />
            <span>PROPATH</span>
          </a>
          <div class="intro-text">
            <h2>Unlock Your Career Journey</h2>
            <p>Access hand-picked developer opportunities, connect with mentors, and keep track of your active application metrics.</p>
          </div>
          <div class="sidebar-img-wrapper">
            <img src="../../assets/Image/main.jpeg" alt="Dashboard illustration" />
          </div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="auth-form-side h-100">
          <div class="auth-tabs">
            <a href="javascript:void(0);" class="auth-tab active">Login</a>
            <a href="signup.html" class="auth-tab">SignUp</a>
          </div>

          <form action="#" method="POST">
            <div class="form-group-custom">
              <label for="email">Email:</label>
              <div class="input-wrapper">
                <input type="email" id="email" name="email" required placeholder="name@domain.com" />
                <i class="fa-solid fa-envelope"></i>
              </div>
            </div>
            <div class="form-group-custom">
              <label for="password">Password:</label>
              <div class="input-wrapper">
                <input type="password" id="password" name="password" required placeholder="••••••••" />
                <i class="fa-solid fa-eye" id="togglePassword"></i>
              </div>
              <div class="text-end mt-2">
                <a href="#" class="text-decoration-none text-muted" style="font-size: 0.8rem;">Forget Password</a>
              </div>
            </div>
            <div class="d-flex gap-3 mt-5">
              <button type="submit" class="btn-auth-submit px-5">Login</button>
              <a href="../index.html" class="btn-auth-cancel px-5">Cancel</a>
            </div>
          </form>
          
        </div>
      </div>
      
    </div>
  </div>

  <script src="../../assets/bootstrap-5.1.3-dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth-loader.js"></script>
  <script>
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var emailVal = document.getElementById("email").value;
      var passwordVal = document.getElementById("password").value;
      
      if (emailVal === "harini@gmail.com" && passwordVal === "Harini@12") {
          runAuthLoader("../User/seeker.html", false);
      }
      else if (emailVal === "admin@jpns.com" && passwordVal === "Admin@123") {
          runAuthLoader("../User/admin.html", false);
      }
      else {
          alert("Invalid credentials! Please try again.");
      }
    });

    const togglePassword = document.querySelector('#togglePassword');
    const passwordInput = document.querySelector('#password');
    togglePassword.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.classList.toggle('fa-eye-slash');
    });
  </script>
</body>
</html>
